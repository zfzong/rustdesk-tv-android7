# RustDesk TV · Android 7.1 电视盒子 APK 云端构建
#
# 为什么必须云端编译：RustDesk 的界面由 Flutter/Dart 编译进 libapp.so，
# 不是可替换的 XML 资源；改外观必须 Fork 源码 → 改 Dart → 重建 Flutter +
# Rust NDK + vcpkg → 重签名。官方只在 Linux runner 上验证过 Android 构建。
#
# 使用：GitHub → Actions → "RustDesk TV (Android 7.1)" → Run workflow
#       abi 选 armv7（32 位老盒子默认）/ arm64 / both
# 产物：Actions 运行页的 Artifacts 里下载 rustdesk-tv-apk-*

name: RustDesk TV (Android 7.1)

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "CPU 架构（安卓 7.1 老盒子多为 32 位）"
        required: true
        default: "armv7"
        type: choice
        options:
          - armv7
          - arm64
          - both
      tv_mode:
        description: "启用 TV 横屏 / 遥控器界面（关闭则出官方手机版）"
        required: true
        default: true
        type: boolean

env:
  RUST_VERSION: "1.75"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  CARGO_NDK_VERSION: "3.1.2"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  NDK_VERSION: "r28c"
  VERSION: "1.5.1-tv"

permissions:
  contents: read

jobs:
  # ── 生成 flutter-rust-bridge（仓库不提交 generated_bridge.dart，官方 CI 也是先生成）──
  generate-bridge:
    name: generate flutter-rust-bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev \
            libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: tv-bridge

      - name: Install Flutter (bridge generator)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install flutter_rust_bridge_codegen
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # Flutter 3.22.3 解析不了 extended_text 14，与官方 bridge job 保持一致
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tv-bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  # ── 编译 APK ─────────────────────────────────────────────────────────────
  build:
    needs: [generate-bridge]
    name: build TV apk ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armv7
            target: armv7-linux-androideabi
            triplet: armeabi-v7a
            platform: android-arm
            apk_abi: armeabi-v7a
            ndk_script: ndk_arm.sh
            libcxx_dir: arm-linux-androideabi
          - abi: arm64
            target: aarch64-linux-android
            triplet: arm64-v8a
            platform: android-arm64
            apk_abi: arm64-v8a
            ndk_script: ndk_arm64.sh
            libcxx_dir: aarch64-linux-android
    steps:
      - name: Free disk space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export Actions cache environment (vcpkg binary cache)
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib git g++ g++-multilib \
            libayatana-appindicator3-dev libasound2-dev libc6-dev libclang-dev \
            libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev libxfixes-dev llvm-dev nasm ninja-build \
            openjdk-17-jdk-headless pkg-config wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tv-bridge-artifact
          path: ./

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch Flutter 3.24.5
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff || true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (${{ matrix.abi }})
        if: ${{ github.event.inputs.abi == 'both' || github.event.inputs.abi == matrix.abi }}
        run: ./flutter/build_android_deps.sh "${{ matrix.triplet }}"
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: tv-rust-android
          key: ${{ matrix.target }}

      - name: Build Rust library (${{ matrix.target }})
        if: ${{ github.event.inputs.abi == 'both' || github.event.inputs.abi == matrix.abi }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/${{ matrix.ndk_script }}
          mkdir -p ./flutter/android/app/src/main/jniLibs/${{ matrix.apk_abi }}
          cp ./target/${{ matrix.target }}/release/liblibrustdesk.so \
             ./flutter/android/app/src/main/jniLibs/${{ matrix.apk_abi }}/librustdesk.so

      - name: Build APK (${{ matrix.abi }}, TV_MODE=${{ github.event.inputs.tv_mode }})
        if: ${{ github.event.inputs.abi == 'both' || github.event.inputs.abi == matrix.abi }}
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          # 自建构建用 debug 签名，免去 key.properties；adb install 可直接装
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          mkdir -p ./flutter/android/app/src/main/jniLibs/${{ matrix.apk_abi }}
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.libcxx_dir }}/libc++_shared.so \
             ./flutter/android/app/src/main/jniLibs/${{ matrix.apk_abi }}/
          cp ./target/${{ matrix.target }}/release/liblibrustdesk.so \
             ./flutter/android/app/src/main/jniLibs/${{ matrix.apk_abi }}/librustdesk.so
          pushd flutter
          flutter pub get
          flutter build apk --release \
            --target-platform ${{ matrix.platform }} \
            --split-per-abi \
            --dart-define=TV_MODE=${{ github.event.inputs.tv_mode }} \
            --build-name=${{ env.VERSION }}
          popd
          cp ./flutter/build/app/outputs/flutter-apk/app-${{ matrix.apk_abi }}-release.apk \
             ./rustdesk-tv-${{ matrix.abi }}-android7.apk

      - name: Upload APK
        if: ${{ github.event.inputs.abi == 'both' || github.event.inputs.abi == matrix.abi }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-tv-apk-${{ matrix.abi }}
          path: ./rustdesk-tv-${{ matrix.abi }}-android7.apk
          if-no-files-found: error
